<!DOCTYPE html>
<!--
    ============================================================================
    test.html — автономная (standalone) версия Test.vue
    ============================================================================

    ЧТО ЭТО:
      Обычный HTML-файл без сборки. Повторяет функционал и интерфейс
      Vue-компонента Test.vue: определение направления взгляда, состояния глаз
      (открыты/закрыты) и отрисовка оверлея поверх видео — всё на MediaPipe
      Face Mesh + чистый JS.

    ЧЕМ ОТЛИЧАЕТСЯ ОТ ОРИГИНАЛА (важно для задачи «две камеры»):
      В оригинале одна камера через утилиту MediaPipe Camera. Здесь добавлен
      ВЫБОР ИСТОЧНИКА ВИДЕО: можно выбрать любую камеру из списка устройств.
      Это задел под устройство с двумя камерами: откройте этот файл ДВАЖДЫ
      (в двух вкладках/окнах) и в каждой выберите свою камеру — получите два
      независимых анализа. Для синхронной обработки двух потоков в одном окне
      смотрите секцию "ДВЕ КАМЕРЫ" внизу файла.

    ЧТО СЧИТАЕТСЯ (как в оригинальном Test.vue):
      - Взгляд (влево/вправо/вверх/вниз/центр) по соотношению положения
        радужки внутри глаза (h/v ratio), со сглаживанием и калибровкой.
      - Открытость глаз по Eye Aspect Ratio (EAR): 6 точек на глаз.
      - Отрисовка контуров глаз, центров радужки и вектора взгляда.

    ЗАВИСИМОСТИ (что подключено и откуда):
      MediaPipe Face Mesh (JS-решение, официальный CDN jsDelivr):
        - Документация: https://google.github.io/mediapipe/solutions/face_mesh.html
        - Пакет CDN:    https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/
      Подключаем через <script src> в <head>:
        face_mesh.js  — сам API FaceMesh
        camera_utils.js — утилита Camera из пакета @mediapipe/camera_utils
      Файлы модели (.binarypb, .wasm, .data) Face Mesh подтягивает сам по
      locateFile => тот же CDN. Ничего скачивать вручную не нужно.
      Если официальный CDN недоступен (нет интернета) — см. LOCAL SNAPSHOT ниже.

    ЛОКАЛЬНЫЙ SNAPSHOT (если нужен офлайн):
      В проекте уже лежит копия: public/mediapipe/* (face_mesh.js,
      camera_utils.js, wasm, data...). Чтобы использовать её, замените
      MP_BASE_URL на '/mediapipe' (при размещении html рядом с public) —
      код в getFaceMeshOptions() это прямо предусматривает.

    ЗАПУСК:
      Нужен localhost или HTTPS (иначе камера запрещена):
           python3 -m http.server 5500
           # http://localhost:5500/app/components/video/test.html
-->
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Направление взгляда (standalone)</title>

  <!-- ===== MediaPipe Face Mesh: официальный CDN (jsDelivr) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    /* Стили повторяют scoped-стили из Test.vue */
    :root {
      --ok: #d4f5e2;   --ok-text: #006633;
      --warn: #fff3cd; --warn-text: #8a6100;
      --bad: #ffe5e5;  --bad-text: #aa0000;
      --neutral: #f0f0f0; --neutral-text: #555;
    }

    * { box-sizing: border-box; }

    .gaze-app {
      max-width: 640px;
      margin: 0 auto;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h2 { margin-bottom: 12px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    .controls button {
      padding: 8px 16px;
      background: #00aa66;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background .15s;
    }
    .controls button:hover { background: #00cc77; }
    .controls select {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      max-width: 260px;
    }

    /* Метрики */
    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      background: var(--neutral);
      color: var(--neutral-text);
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .metric .metric-label { color: #666; }
    .metric .metric-value { font-weight: 700; }
    .metric.ratio .metric-value { font-family: monospace; font-size: 12px; }

    .metric.ok      { background: var(--ok);      color: var(--ok-text); }
    .metric.ok      .metric-label { color: #008855; }
    .metric.warn    { background: var(--warn);    color: var(--warn-text); }
    .metric.warn    .metric-label { color: #aa7a00; }
    .metric.bad     { background: var(--bad);     color: var(--bad-text); }
    .metric.bad     .metric-label { color: #cc3333; }
    .metric.neutral { background: var(--neutral); color: var(--neutral-text); }

    /* Видео + canvas */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    .video {
      width: 100%;
      display: block;
      transform: scaleX(-1); /* зеркалим, как в оригинале */
    }
    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <div class="gaze-app">
    <h2>Определение направления взгляда</h2>

    <!-- Панель управления -->
    <div class="controls">
      <select id="cameraSelect" title="Источник видео (для устройства с двумя камерами)">
        <option value="">Камера по умолчанию</option>
      </select>
      <button id="startBtn">▶ Старт</button>
      <button id="calibrateBtn">Калибровать (смотреть в центр)</button>
    </div>

    <!-- Метрики -->
    <div class="metrics">
      <div id="mFace" class="metric bad">
        <span class="metric-label">Лицо:</span>
        <strong class="metric-value">—</strong>
      </div>
      <div id="mEyes" class="metric neutral">
        <span class="metric-label">Глаза:</span>
        <strong class="metric-value">❓ —</strong>
      </div>
      <div id="mGaze" class="metric neutral">
        <span class="metric-label">Взгляд:</span>
        <strong class="metric-value">❓ —</strong>
      </div>
      <div id="mRatio" class="metric neutral ratio">
        <span class="metric-label">h/v:</span>
        <strong class="metric-value">—</strong>
      </div>
      <div id="mCalib" class="metric warn">
        <span class="metric-label">Калибровка:</span>
        <strong class="metric-value">⚠ нажмите кнопку</strong>
      </div>
    </div>

    <!-- Видео + canvas -->
    <div class="video-container">
      <video id="video" autoplay playsinline class="video"></video>
      <canvas id="canvas" class="overlay"></canvas>
    </div>
  </div>

<script>
/* =========================================================================
   1. КОНСТАНТЫ (индексы landmarks MediaPipe Face Mesh)
   ========================================================================= */

// Откуда грузить файлы модели Face Mesh.
// Официальный CDN (по умолчанию):
const MP_BASE_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4';
// Локальная копия проекта (раскомментируйте для офлайна, если html в public):
// const MP_BASE_URL = '/mediapipe';

// Радужка (iris)
const LEFT_IRIS = [468, 469, 470, 471, 472];
const RIGHT_IRIS = [473, 474, 475, 476, 477];

// Контуры глаз для h/v ratio: углы и веки
const LEFT_EYE = { left: 33, right: 133, top: 159, bottom: 145 };
const RIGHT_EYE = { left: 362, right: 263, top: 386, bottom: 374 };

// 6 точек для EAR (Eye Aspect Ratio)
const LEFT_EYE_EAR = [33, 160, 158, 133, 153, 144];
const RIGHT_EYE_EAR = [263, 387, 385, 362, 380, 373];

// Контуры глаз для визуализации
const LEFT_EYE_CONTOUR = [33, 7, 163, 144, 145, 153, 154, 155, 133, 173, 157, 158, 159, 160, 161, 246];
const RIGHT_EYE_CONTOUR = [263, 249, 390, 373, 374, 380, 381, 382, 362, 398, 384, 385, 386, 387, 388, 466];

// Пороги
const H_THRESHOLD = 0.12;
const V_THRESHOLD = 0.12;
const EAR_THRESHOLD = 0.18;

// Окна сглаживания
const SMOOTHING_WINDOW = 8;
const EAR_SMOOTH = 5;

/* =========================================================================
   2. СОСТОЯНИЕ
   ========================================================================= */
const state = {
  faceDetected: false,
  leftEyeOpen: false,
  rightEyeOpen: false,
  eyesState: 'unknown',      // both-open | left-closed | right-closed | both-closed | unknown
  gazeDirection: 'unknown',  // center | left | right | up | down | unknown
  gazeRatio: { h: 0.5, v: 0.5 },
  isCalibrated: false,
};

// Смещения калибровки
const calibrationOffset = { h: 0, v: 0 };

// Буферы сглаживания
const hBuffer = [];
const vBuffer = [];
const leftEarBuf = [];
const rightEarBuf = [];

// Текущие объекты
let faceMesh = null;
let camera = null;
let currentStream = null;

/* =========================================================================
   3. DOM
   ========================================================================= */
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const cameraSelect = document.getElementById('cameraSelect');
const startBtn = document.getElementById('startBtn');
const calibrateBtn = document.getElementById('calibrateBtn');
const mFace = document.getElementById('mFace');
const mEyes = document.getElementById('mEyes');
const mGaze = document.getElementById('mGaze');
const mRatio = document.getElementById('mRatio');
const mCalib = document.getElementById('mCalib');

/* =========================================================================
   4. УТИЛИТЫ
   ========================================================================= */

function getIrisCenter(landmarks, indices) {
  let x = 0, y = 0;
  for (const i of indices) { x += landmarks[i].x; y += landmarks[i].y; }
  return { x: x / indices.length, y: y / indices.length };
}

/** Соотношение положения радужки внутри глаза (0..1 по каждой оси). */
function getEyeRatio(landmarks, irisIndices, eye) {
  const iris = getIrisCenter(landmarks, irisIndices);
  const leftCorner = landmarks[eye.left];
  const rightCorner = landmarks[eye.right];
  const topLid = landmarks[eye.top];
  const bottomLid = landmarks[eye.bottom];

  const hRatio = (iris.x - leftCorner.x) / (rightCorner.x - leftCorner.x);
  const vRatio = (iris.y - topLid.y) / (bottomLid.y - topLid.y);
  return { h: hRatio, v: vRatio };
}

function euclidean(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

/** Eye Aspect Ratio — вертикаль / горизонталь глаза. Меньше порога => глаз закрыт. */
function eyeAspectRatio(landmarks, eye) {
  const [p1, p2, p3, p4, p5, p6] = eye.map(i => landmarks[i]);
  const vertical = euclidean(p2, p6) + euclidean(p3, p5);
  const horizontal = 2 * euclidean(p1, p4);
  return horizontal === 0 ? 0 : vertical / horizontal;
}

/** Скользящее среднее по буферу фиксированной длины. */
function smooth(value, buffer, maxLen) {
  buffer.push(value);
  if (buffer.length > maxLen) buffer.shift();
  return buffer.reduce((a, b) => a + b, 0) / buffer.length;
}

/* =========================================================================
   5. ОТРИСОВКА (canvas overlay)
   ========================================================================= */

function drawPupil(landmarks, indices, color = 'red') {
  const center = getIrisCenter(landmarks, indices);
  const x = center.x * canvas.width;
  const y = center.y * canvas.height;
  const size = 18;

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.strokeRect(x - size / 2, y - size / 2, size, size);

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawEyeContour(landmarks, contour, color, closed) {
  ctx.beginPath();
  contour.forEach((idx, i) => {
    const p = landmarks[idx];
    const x = p.x * canvas.width;
    const y = p.y * canvas.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.closePath();

  if (closed) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
    ctx.fill();
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
}

/** Вектор взгляда (стрелка из центра экрана) + точка. */
function drawGazeVisualization(w, h) {
  const centerX = w / 2;
  const centerY = h / 2;
  const visualRadius = Math.min(w, h) * 0.25;

  // Внешнее кольцо
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(centerX, centerY, visualRadius * 0.4, 0, Math.PI * 2);
  ctx.stroke();

  // Центральный крестик
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(centerX - 15, centerY); ctx.lineTo(centerX + 15, centerY);
  ctx.moveTo(centerX, centerY - 15); ctx.lineTo(centerX, centerY + 15);
  ctx.stroke();

  // Смещение относительно центра с учётом калибровки
  const hOffset = (state.gazeRatio.h - 0.5 - calibrationOffset.h) * 2;
  const vOffset = (state.gazeRatio.v - 0.5 - calibrationOffset.v) * 2;
  const clampedH = Math.max(-1, Math.min(1, hOffset));
  const clampedV = Math.max(-1, Math.min(1, vOffset));

  const gazeX = centerX + clampedH * visualRadius;
  const gazeY = centerY + clampedV * visualRadius;

  // Пунктирная линия центр -> точка
  ctx.strokeStyle = 'rgba(0, 255, 200, 0.6)';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  ctx.moveTo(centerX, centerY);
  ctx.lineTo(gazeX, gazeY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Точка
  const dotColor =
    state.gazeDirection === 'center' ? '#00ff88' :
    state.gazeDirection === 'unknown' ? '#888888' : '#ffaa00';

  ctx.fillStyle = dotColor;
  ctx.beginPath();
  ctx.arc(gazeX, gazeY, 10, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'white';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(gazeX, gazeY, 10, 0, Math.PI * 2);
  ctx.stroke();
}

/* =========================================================================
   6. ОБНОВЛЕНИЕ МЕТРИК (замена Vue computed)
   ========================================================================= */
function updateMetrics() {
  // Лицо
  mFace.className = 'metric ' + (state.faceDetected ? 'ok' : 'bad');
  mFace.querySelector('.metric-value').textContent =
    state.faceDetected ? '✅ На экране' : '❌ Не найдено';

  // Глаза
  const eyeMap = {
    'both-open':    ['ok',      '👀 Открыты'],
    'both-closed':  ['bad',     '😑 Закрыты'],
    'left-closed':  ['warn',    '◀ Левый закрыт'],
    'right-closed': ['warn',    '▶ Правый закрыт'],
    'unknown':      ['neutral', '❓ —'],
  };
  const [eyeCls, eyeText] = eyeMap[state.eyesState] || eyeMap.unknown;
  mEyes.className = 'metric ' + eyeCls;
  mEyes.querySelector('.metric-value').textContent = eyeText;

  // Взгляд
  const gazeMap = {
    'center':  ['ok',      '🎯 Центр'],
    'left':    ['warn',    '⬅️ Влево'],
    'right':   ['warn',    '➡️ Вправо'],
    'up':      ['warn',    '⬆️ Вверх'],
    'down':    ['warn',    '⬇️ Вниз'],
    'unknown': ['neutral', '❓ —'],
  };
  const [gazeCls, gazeText] = gazeMap[state.gazeDirection] || gazeMap.unknown;
  mGaze.className = 'metric ' + gazeCls;
  mGaze.querySelector('.metric-value').textContent = gazeText;

  // Координаты h/v
  mRatio.querySelector('.metric-value').textContent =
    state.gazeRatio.h.toFixed(3) + ' / ' + state.gazeRatio.v.toFixed(3);

  // Калибровка
  mCalib.className = 'metric ' + (state.isCalibrated ? 'ok' : 'warn');
  mCalib.querySelector('.metric-value').textContent =
    state.isCalibrated ? '✓' : '⚠ нажмите кнопку';
}

/* =========================================================================
   7. ОБРАБОТКА РЕЗУЛЬТАТОВ FACE MESH
   ========================================================================= */
function onResults(results) {
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Лицо не найдено
  if (!results.multiFaceLandmarks || !results.multiFaceLandmarks.length) {
    state.faceDetected = false;
    state.leftEyeOpen = false;
    state.rightEyeOpen = false;
    state.eyesState = 'unknown';
    state.gazeDirection = 'unknown';
    updateMetrics();
    return;
  }

  state.faceDetected = true;
  const landmarks = results.multiFaceLandmarks[0];

  // ----- Взгляд: среднее левого и правого глаза (правый зеркалим) -----
  const left = getEyeRatio(landmarks, LEFT_IRIS, LEFT_EYE);
  const right = getEyeRatio(landmarks, RIGHT_IRIS, RIGHT_EYE);

  const rawH = (left.h + (1 - right.h)) / 2;
  const rawV = (left.v + right.v) / 2;

  const smoothH = smooth(rawH, hBuffer, SMOOTHING_WINDOW);
  const smoothV = smooth(rawV, vBuffer, SMOOTHING_WINDOW);
  state.gazeRatio = { h: smoothH, v: smoothV };

  const hOffset = smoothH - 0.5 - calibrationOffset.h;
  const vOffset = smoothV - 0.5 - calibrationOffset.v;

  if (Math.abs(hOffset) < H_THRESHOLD && Math.abs(vOffset) < V_THRESHOLD) {
    state.gazeDirection = 'center';
  } else if (Math.abs(hOffset) > Math.abs(vOffset)) {
    state.gazeDirection = hOffset > 0 ? 'left' : 'right';
  } else {
    state.gazeDirection = vOffset > 0 ? 'down' : 'up';
  }

  // ----- Открытость глаз (EAR) -----
  const leftEar = smooth(eyeAspectRatio(landmarks, LEFT_EYE_EAR), leftEarBuf, EAR_SMOOTH);
  const rightEar = smooth(eyeAspectRatio(landmarks, RIGHT_EYE_EAR), rightEarBuf, EAR_SMOOTH);

  const leftClosed = leftEar < EAR_THRESHOLD;
  const rightClosed = rightEar < EAR_THRESHOLD;

  state.leftEyeOpen = !leftClosed;
  state.rightEyeOpen = !rightClosed;

  if (leftClosed && rightClosed) state.eyesState = 'both-closed';
  else if (leftClosed) state.eyesState = 'left-closed';
  else if (rightClosed) state.eyesState = 'right-closed';
  else state.eyesState = 'both-open';

  // Оба глаза закрыты => взгляд не определён
  if (state.eyesState === 'both-closed') state.gazeDirection = 'unknown';

  // ----- Отрисовка -----
  drawPupil(landmarks, LEFT_IRIS, 'red');
  drawPupil(landmarks, RIGHT_IRIS, 'red');
  drawEyeContour(landmarks, LEFT_EYE_CONTOUR, state.leftEyeOpen ? 'lime' : 'red', !state.leftEyeOpen);
  drawEyeContour(landmarks, RIGHT_EYE_CONTOUR, state.rightEyeOpen ? 'lime' : 'red', !state.rightEyeOpen);
  drawGazeVisualization(canvas.width, canvas.height);

  updateMetrics();
}

/* =========================================================================
   8. СТАРТ / СТОП ВИДЕО
   ========================================================================= */

async function startVideo() {
  stopVideo(); // на случай перезапуска

  const deviceId = cameraSelect.value || null;
  const videoConstraints = deviceId
    ? { deviceId: { exact: deviceId }, width: 640, height: 480 }
    : { width: 640, height: 480 };

  try {
    // Получаем поток с выбранной камеры
    currentStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
  } catch (e) {
    console.error('Не удалось открыть камеру', e);
    alert('Не удалось открыть камеру: ' + e.message +
          '\nПроверьте разрешения и что страница открыта по localhost/HTTPS.');
    return;
  }

  video.srcObject = currentStream;

  // Face Mesh: создаём один раз
  if (!faceMesh) {
    faceMesh = new FaceMesh({
      // Face Mesh сам догрузит модель по этому пути
      locateFile: (file) => `${MP_BASE_URL}/${file}`,
    });
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,        // иначе не будет landmarks радужки (468+)
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    faceMesh.onResults(onResults);
  }

  // Camera из утилиты MediaPipe: гоняет кадры из video в faceMesh
  camera = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({ image: video });
    },
    width: 640,
    height: 480,
  });

  await camera.start();
  startBtn.textContent = '⟳ Перезапустить';
}

function stopVideo() {
  if (camera) { try { camera.stop(); } catch (_) {} camera = null; }
  if (currentStream) {
    currentStream.getTracks().forEach(tr => tr.stop());
    currentStream = null;
  }
  video.srcObject = null;
}

/* =========================================================================
   9. КАЛИБРОВКА (смотреть в центр и нажать кнопку)
   ========================================================================= */
function calibrate() {
  calibrationOffset.h = state.gazeRatio.h - 0.5;
  calibrationOffset.v = state.gazeRatio.v - 0.5;
  state.isCalibrated = true;
  updateMetrics();
}

/* =========================================================================
   10. СПИСОК КАМЕР (для выбора источника)
   ========================================================================= */
async function listCameras() {
  try {
    // Без разрешения метки камер скрыты — просим доступ один раз
    await navigator.mediaDevices.getUserMedia({ video: true })
      .then(s => s.getTracks().forEach(t => t.stop()))
      .catch(() => {});

    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');

    cameraSelect.innerHTML = '<option value="">Камера по умолчанию</option>';
    cams.forEach((c, i) => {
      const opt = document.createElement('option');
      opt.value = c.deviceId;
      opt.textContent = c.label || `Камера ${i + 1}`;
      cameraSelect.appendChild(opt);
    });
  } catch (e) {
    console.warn('Не удалось получить список камер', e);
  }
}

/* =========================================================================
   11. СОБЫТИЯ
   ========================================================================= */
startBtn.addEventListener('click', startVideo);
calibrateBtn.addEventListener('click', calibrate);
window.addEventListener('beforeunload', stopVideo);

// Инициализация
updateMetrics();
listCameras();

/* =========================================================================
   12. ДВЕ КАМЕРЫ — практические заметки
   =========================================================================
   Для устройства с двумя камерами есть несколько стратегий:

   A) Два независимых инстанса (проще всего):
      Откройте этот файл в двух окнах и в каждом выберите свою камеру из
      выпадающего списка. Каждое окно — свой FaceMesh и свой Camera.
      Минус: нет общей синхронизации кадров по времени. Для грубого анализа
      «левая/правая камера видит одно и то же лицо» этого достаточно.

   B) Два потока в одном окне (один FaceMesh, два video):
      - Откройте два getUserMedia для разных deviceId.
      - Для каждого создайте свой экземпляр FaceMesh (или один общий, но
        вызывать faceMesh.send() поочерёдно — они асинхронные).
      - Метки времени проставляйте через performance.now() в onResults,
        чтобы потом сопоставить кадры двух камер:
            const t = performance.now();
            frameLog.push({ t, cam: 'A', landmarks: results.multiFaceLandmarks[0] });
      - Учтите: FaceMesh — "тяжёлая" модель. Два потока в реальном времени
        на слабом железе могут проседать по FPS. Можно понизить частоту
        отправки кадров (например, раз в 100 мс) через throttling в onFrame.

   C) Стерео (две камеры жёстко закреплены рядом):
      Тогда по двум наборам landmarks можно восстанавливать 3D-положение
      головы/зрачка (триангуляция). Для этого нужны:
        - Калибровка стереопары (внутренние/внешние параметры камер).
        - Соответствие точек: используйте одни и те же индексы landmarks
          (например, уголки глаз, кончик носа) как соответствия.
      Это выходит за рамки MediaPipe Face Mesh, но landmarks 3D (z) из
      Face Mesh — нормированные, их можно использовать как стартовое
      приближение.

   D) Не забывайте освобождать камеры:
        stream.getTracks().forEach(tr => tr.stop());
      На некоторых ноутбуках две камеры одновременно недоступны.
   ========================================================================= */
</script>
